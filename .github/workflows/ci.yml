name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/agent-harness

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Backend tests
        run: npm test

      - name: Web tests
        run: npm run test:web

      - name: Typecheck and build
        run: npm run build

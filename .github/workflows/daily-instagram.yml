name: Instagram diário

on:
  schedule:
    - cron: "30 15 * * 1-5" # 12:30 BRT, segunda a sexta
  workflow_dispatch:
    inputs:
      workspace_id:
        description: "Workspace"
        required: false
        default: "nextassist"
        type: string

permissions:
  contents: write

jobs:
  publish-instagram:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.workspace_id || 'nextassist' }}
    concurrency:
      group: instagram-${{ github.event.inputs.workspace_id || 'nextassist' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Rodar pipeline do Instagram
        env:
          WORKSPACE_ID: ${{ github.event.inputs.workspace_id || 'nextassist' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
          FIREBASE_ADMIN_EMAIL: ${{ secrets.FIREBASE_ADMIN_EMAIL }}
          FIREBASE_ADMIN_PASSWORD: ${{ secrets.FIREBASE_ADMIN_PASSWORD }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_STORAGE_BUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_FALLBACK: ${{ secrets.GEMINI_API_KEY_FALLBACK }}
        run: npm run instagram

      - name: Commitar calendário e registro do Instagram
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "workspaces/${{ github.event.inputs.workspace_id || 'nextassist' }}"/*.json
          if git diff --staged --quiet; then
            echo "Nenhuma mudança de estado."
          else
            git commit -m "chore: registro da pipeline Instagram [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
